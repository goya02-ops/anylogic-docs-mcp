[project]
name = "anylogic-docs-mcp"
version = "1.0.0"
description = "Servidor MCP con la documentación de AnyLogic 8.9 en local, para agentes de IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

# Este proyecto no se instala como paquete: se ejecuta desde el repo
# (server/main.py). Las dependencias están aquí para que `uv sync` funcione.
